<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Weapon Chronicle · DEV live preview</title>
<style>
html,body{margin:0;min-height:100%;background:#101b2a;color:#f1d6a6;font:16px system-ui,sans-serif}
#status{max-width:460px;margin:12vh auto;padding:20px;line-height:1.7;text-align:center}
small{display:block;color:#a7b3c4;margin-top:8px}button{font:inherit;border-radius:8px;padding:8px 14px;background:#f1d6a6;color:#142030;border:0}
</style>
</head>
<body>
<div id="status"><strong>Weapon Chronicle · DEV</strong><small id="detail">최신 dev 소스에서 게임을 조립하고 있습니다.</small></div>
<script>
(async function(){
  "use strict";
  const detail=document.getElementById("detail");
  try{
  // The same manifest and order are used by the offline Python builder.
  const manifestResponse=await fetch("./src/module_manifest.json",{cache:"no-store"});
  if(!manifestResponse.ok)throw Error("모듈 목록 다운로드 실패");
  const manifest=await manifestResponse.json();
  if(manifest.schema!==1||!Array.isArray(manifest.modules))
    throw Error("지원하지 않는 모듈 목록");
  const loaded=new Set(),scriptParts=[];
  for(const entry of manifest.modules){
    if(!entry||typeof entry.id!=="string"||
       typeof entry.path!=="string"||!Array.isArray(entry.requires)||
       !/^(legacy|core|story)\/[a-zA-Z0-9_/-]+\.js$/.test(entry.path)||
       loaded.has(entry.id)||entry.requires.some(id=>!loaded.has(id)))
      throw Error("모듈 의존성/경로 오류: "+(entry?.id||"?"));
    loaded.add(entry.id);
    scriptParts.push(entry.path);
  }
  if(manifest.modules[0]?.id!=="legacy-runtime"||
     manifest.modules.at(-1)?.id!=="bootstrap")
    throw Error("레거시/시작 모듈 순서 오류");
  const supporting=[
    "legacy/html_before_script.html","legacy/html_after_script.html",
    "combat/story_combat.html","story/main_chapters_v47.js","story/chapter1_scenes_v1.json",
    "ui/unified_theme_v8.css","ui/combat_theme_v8.css"
  ];
  const paths=[...new Set([...scriptParts,...supporting])];
    const entries=await Promise.all(paths.map(async path=>{
      const response=await fetch("./src/"+path,{cache:"no-store"});
      if(!response.ok)throw Error(path+" 다운로드 실패 (HTTP "+response.status+")");
      return [path,await response.text()];
    }));
    const files=Object.fromEntries(entries);
    function replaceOnce(source,marker,replacement){
      const first=source.indexOf(marker);
      if(first===-1||source.indexOf(marker,first+marker.length)!==-1)
        throw Error("조립 위치 오류: "+marker);
      return source.slice(0,first)+replacement+source.slice(first+marker.length);
    }
    let combat=files["combat/story_combat.html"];
    for(const module of ["combat_math_v1","legacy_combat_sources_v1"]){
      combat=replaceOnce(combat,"/* @include:"+module+" */",files["core/"+module+".js"]);
    }
  // Use exactly ten selected cards, without automatic story-card additions.
  combat=replaceOnce(combat,
    'const BASE_DECK=["aim1","aim2","guard","over","blood","feint","giant","last","reroll","reverse","counter","endure"];',
    "const BASE_DECK=(()=>{const fallback=[\"aim1\",\"guard\",\"over\",\"blood\",\"feint\",\"giant\",\"reroll\",\"reverse\",\"counter\",\"endure\"];const raw=STORY_FRAME?.dataset?.skillDeck||STORY_PARAMS.get(\"skillDeck\")||\"\";try{const cards=JSON.parse(raw);if(Array.isArray(cards)&&cards.length===10&&new Set(cards).size===10&&cards.every(id=>typeof id===\"string\"&&CARD_DB[id]))return cards;}catch(e){}return fallback;})();");
  for(const [tag,id] of [
    ["carapace_gap","storyGap"],["left_behind","storyLeft"],
    ["silent_prayer","storyPrayer"],["cyclops_gap","mainCyclops"],["carry_them","mainCarry"]
  ]){
    combat=replaceOnce(combat,"if(STORY_SKILLS.has('"+tag+"')) BASE_DECK.push('"+id+"');",
      "// Earned story cards enter only when equipped in the ten-slot deck.");
  }
    // Match tools/build_sources.py without committing a 10 MB generated bundle.
    if(combat.split("</body>").length!==2)throw Error("전투 테마 삽입 위치 오류");
    combat=combat.replace("</body>",
      '<style id="wc-combat-theme-v8">\n'+files["ui/combat_theme_v8.css"]+'\n</style></body>');
    const data=new TextEncoder().encode(combat);
    const chunks=[];
    for(let i=0;i<data.length;i+=16384)
      chunks.push(String.fromCharCode(...data.subarray(i,i+16384)));
    const combatB64=btoa(chunks.join(""));
    let scripts=scriptParts.map(path=>files[path]);
    const substitutions=[
      ["/* @include:combat-document */","const COMBAT_DOC_B64="+JSON.stringify(combatB64)+";"],
      ["/* @include:main-chapters-v47 */",files["story/main_chapters_v47.js"].replace(/\n$/,"")],
      // Same embedding as tools/build_sources.py: card data stays JSON, the game never fetches it.
      ["/* @include:chapter1-scenes-json */","const WC_CH1_SCENES_JSON_V1="+
        JSON.stringify(JSON.parse(files["story/chapter1_scenes_v1.json"])).replace(/</g,"\\u003c")+";"]
    ];
    for(const [marker,value] of substitutions){
      let hits=0;
      scripts=scripts.map(source=>{
        if(source.includes(marker)){hits++;return replaceOnce(source,marker,value);}
        return source;
      });
      if(hits!==1)throw Error("조립 위치 개수 오류: "+marker+" ("+hits+")");
    }
    let html=files["legacy/html_before_script.html"]+
      "<script>\n"+scripts.join("\n")+"\n<"+"/script>"+
      files["legacy/html_after_script.html"];
    const bodyEnd=html.lastIndexOf("</body>");
    if(bodyEnd<0)throw Error("테마 삽입 위치 오류");
    html=html.slice(0,bodyEnd)+
      '<style id="wc-unified-theme-v8">\n'+files["ui/unified_theme_v8.css"]+'\n</style>'+
      html.slice(bodyEnd);
    if(!html.includes("WC_STATUS_SKILLDECK_V1")||!combat.includes("const BASE_DECK=(()=>{"))
      throw Error("dev 전투/UI 변경 내용이 누락되었습니다.");
  async function managedArtSceneStyle(){
    // Managed art is optional for legacy builds. If present, never render a
    // file before checking the declared SHA. This preview is not an approval gate.
    const manifestResponse=await fetch("./assets/v2-managed/manifest.json",{cache:"no-store"});
    if(manifestResponse.status===404)return "";
    if(!manifestResponse.ok)throw Error("승인 아트 목록 읽기 실패");
    const manifest=await manifestResponse.json();
    if(manifest.schema_version!==1||!Array.isArray(manifest.assets))
      throw Error("승인 아트 목록 형식 오류");
    const scenes=manifest.assets.filter(item=>item&&item.category==="background")
      .sort((a,b)=>String(a.asset_id).localeCompare(String(b.asset_id)));
    if(!scenes.length)return "";
    const scene=scenes[0];
    if(!/^assets\/asset_[a-f0-9]{24}\.(?:png|jpg|webp)$/.test(scene.filename)||
       !["image/png","image/jpeg","image/webp"].includes(scene.media_type)||
       !/^[a-f0-9]{64}$/.test(scene.sha256))
      throw Error("승인 아트 이미지 주소 오류");
    const response=await fetch("./assets/v2-managed/"+scene.filename,{cache:"no-store"});
    if(!response.ok)throw Error("승인 아트 이미지 읽기 실패");
    const bytes=await response.arrayBuffer();
    if(bytes.byteLength!==scene.bytes)throw Error("승인 아트 이미지 크기 불일치");
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)))
      .map(byte=>byte.toString(16).padStart(2,"0")).join("");
    if(digest!==scene.sha256)throw Error("승인 아트 이미지 해시 불일치");
    const objectUrl=URL.createObjectURL(new Blob([bytes],{type:scene.media_type}));
    return '<style id="wc-v2-approved-scene">.app{background-image:'+
      'linear-gradient(180deg,rgba(5,19,26,.65),rgba(5,18,26,.88)),'+
      'url("'+objectUrl+'")!important;background-size:cover!important;'+
      'background-position:center!important;background-repeat:no-repeat!important}'+
      '</style>';
  }
    const managedScene=await managedArtSceneStyle();
    if(managedScene)html=html.replace("</body>",managedScene+"</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error("DEV preview failed",error);
    detail.textContent="개발판 실행 실패: "+(error?.message||String(error));
    const retry=document.createElement("button");
    retry.textContent="새로고침";
    retry.onclick=()=>location.reload();
    document.getElementById("status").appendChild(retry);
  }
})();
</script>
</body>
</html>
