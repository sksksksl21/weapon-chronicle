name: One-shot engraving source build
on:
  push:
    branches: [fix/card-engraving-progress]
    paths:
      - .github/workflows/engraving-patch-once.yml
      - tools/engraving_patch_once.py
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch parent source and rebuild generated files
        run: |
          python3 tools/engraving_patch_once.py
          python3 tools/build.py
          python3 tools/verify_baseline.py
      - name: Commit only expected outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/legacy/game_runtime.js package.json index.html combat_story.html
          git diff --cached --name-only
          git diff --cached --quiet && exit 0
          git commit -m "build: sync engraving progress bridge and offline bundles"
          git push origin HEAD:fix/card-engraving-progress
