name: Web baseline CI
on:
  push:
  pull_request:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: npm run build
      - name: Verify generated code
        run: npm run check
      - name: Verify no uncommitted build drift
        run: git diff --exit-code -- index.html
