# Deliberately no push/pull_request trigger: Actions minutes are budget-limited.
# Request only the checks relevant to a known issue. Local checks are preferred.
name: On-demand web verification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the smallest verification needed
        required: true
        default: quick
        type: choice
        options:
          - quick
          - smoke
          - regression
          - story
          - full

permissions:
  contents: read

concurrency:
  group: on-demand-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build once and verify generated files
        run: |
          npm run build
          npm run check
          git diff --exit-code -- index.html combat_story.html
      - name: Fast combat calculations and source adapter assertions
        run: |
          npm run test:combat-math
          npm run test:combat-adapter
      - name: Install browser only when selected
        if: ${{ inputs.suite != 'quick' }}
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Browser smoke
        if: ${{ inputs.suite == 'smoke' || inputs.suite == 'full' }}
        run: npm run test:smoke
      - name: Browser regression
        if: ${{ inputs.suite == 'regression' || inputs.suite == 'full' }}
        run: |
          rm -f VALIDATION_*.json
          npm run test:regression
      - name: Browser story
        if: ${{ inputs.suite == 'story' || inputs.suite == 'full' }}
        run: |
          rm -f VALIDATION_*.json
          npm run test:story
      - name: Save requested validation report
        if: ${{ always() && inputs.suite != 'quick' }}
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-validation-${{ inputs.suite }}
          path: VALIDATION_*.json
          if-no-files-found: ignore
