name: Web baseline CI
on:
  push:
  pull_request:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: npm run build
      - name: Verify generated code
        run: npm run check
      - name: Verify no uncommitted build drift
        run: git diff --exit-code -- index.html combat_story.html
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regression, story]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run ${{ matrix.suite }} tests
        run: |
          # Only upload reports produced by this run, including on partial failure.
          rm -f VALIDATION_*.json
          npm run test:${{ matrix.suite }}
      - name: Upload test reports
        if: always() && matrix.suite != 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.suite }}
          path: VALIDATION_*.json
