name: Temporary engraving generated bundle synchronization
on:
  push:
    branches: [fix/card-engraving-progress]
    paths:
      - src/combat/story_combat.html
      - .github/workflows/engraving-build-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and check generated HTML
        run: |
          python3 tools/build.py
          python3 tools/verify_baseline.py
      - name: Commit generated outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html combat_story.html
          git diff --cached --quiet && exit 0
          git commit -m "build: synchronize committed-boundary card mastery"
          git push origin HEAD:fix/card-engraving-progress
