name: Import Weapon Chronicle v5.2 baseline
on:
  push:
    branches: [main]
    paths: ['weapon_chronicle_codex_baseline_v52.zip', '.github/workflows/import-v52.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-v52-main
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Detect archive
        id: archive
        shell: bash
        run: |
          if test -f weapon_chronicle_codex_baseline_v52.zip; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Archive already imported; no action needed."
          fi

      - name: Safely extract exact v5.2 archive
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil, tempfile, zipfile
          archive=pathlib.Path('weapon_chronicle_codex_baseline_v52.zip')
          expected='adf95279ffb1b79e0bfb5bec375509efd85e0c2ac63f79e84fedd791f7bb6764'
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Baseline ZIP SHA256 mismatch: {actual}')
          prefix='weapon_chronicle_codex_baseline_v52/'
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None: raise SystemExit('Archive CRC failed')
              for info in z.infolist():
                  name=info.filename
                  p=pathlib.PurePosixPath(name)
                  if not name.startswith(prefix) or p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unexpected archive path: {name}')
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'Symlink forbidden: {name}')
              required=['AGENTS.md','index.html','combat_story.html','tools/build.py','src/legacy/game_runtime.js','.devcontainer/devcontainer.json']
              listing=set(z.namelist())
              for x in required:
                  if prefix+x not in listing: raise SystemExit(f'Missing source: {x}')
              with tempfile.TemporaryDirectory() as tmp:
                  z.extractall(tmp)
                  root=pathlib.Path(tmp)/'weapon_chronicle_codex_baseline_v52'
                  for src in root.iterdir():
                      dst=pathlib.Path(src.name)
                      if src.is_dir(): shutil.copytree(src,dst,dirs_exist_ok=True)
                      else: shutil.copy2(src,dst)
          archive.unlink()
          print('Extracted pinned v5.2 source baseline to repository root')
          PY

      - name: Validate reproducible baseline
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/build.py
          python3 tools/verify_baseline.py
          echo "14afbff408f9ee68f7ae2f585a8dfe258ddffee2b309a701bf89dbfe496867f6  index.html" | sha256sum -c -

      - name: Commit extracted baseline
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The workflow's GITHUB_TOKEN cannot create NEW workflow files on main.
          # Preserve the imported CI definition as a template; publish CI separately.
          if test -f .github/workflows/ci.yml; then
            mkdir -p docs
            mv .github/workflows/ci.yml docs/CI_WORKFLOW_TEMPLATE.yml
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: import verified Weapon Chronicle v5.2 Codex baseline"
          git push origin HEAD:main
